name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run release gate
        run: sh ./scripts/release_gate.sh

      - name: Dump hs_err log if present
        if: always()
        run: |
          for f in $(find . -maxdepth 5 -type f -name 'hs_err_pid*.log' -print); do
            echo "==== $f ===="
            head -n 200 "$f"
            echo "==== end ===="
          done

